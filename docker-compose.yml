# Docker Compose para desarrollo local de Daino.
#
# Servicios:
#   - php      FPM (PHP 8.5.3) compilado desde docker/php/Dockerfile.
#   - nginx    Servidor web fronting PHP-FPM, docroot en /public.
#   - mariadb  Base de datos (MariaDB 11.4) con volumen persistente.
#
# Bun/Vite NO está en docker-compose: se ejecuta en el host (mejor HMR,
# menos overhead). Ver README.md para el flujo de desarrollo.
#
# Uso:
#   docker compose up -d        # arrancar
#   docker compose logs -f      # ver logs
#   docker compose down         # parar (conserva volumen)
#   docker compose down -v      # parar + borrar BD

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: daino-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - daino

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: daino-php:8.5.3
    container_name: daino-php
    volumes:
      - ./:/var/www/html
      - ./docker/php/daino-uploads.ini:/usr/local/etc/php/conf.d/99-daino-uploads.ini:ro
    environment:
      PHP_IDEKEY: DAINO
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - daino

  # Analizador musical (Ola 4): Python + ffmpeg + beat_this (PyTorch CPU) + Node.
  # Saca trabajos de la tabla `analysis_jobs` y guarda análisis y charts.
  # Escalar: `docker compose up -d --scale analyzer=3` (se reparten la cola).
  analyzer:
    build:
      context: ./analyzer
    image: daino-analyzer:dev
    restart: unless-stopped
    command: ["worker"]
    # El código se monta en vivo desde ./analyzer (desarrollo): cambiarlo no
    # exige reconstruir la imagen, solo reiniciar el servicio.
    working_dir: /srv/daino/analyzer
    environment:
      PYTHONPATH: /srv/daino/analyzer
      DAINO_ROOT: /srv/daino
      # Solo lo que necesita: nada de secretos OAuth ni APP_KEY del .env.
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-daino}
      DB_USER: ${DB_USER:-daino}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      ANALYZER_TORCH_THREADS: ${ANALYZER_TORCH_THREADS:-4}
      ANALYZER_JOB_TIMEOUT_SECONDS: ${ANALYZER_JOB_TIMEOUT_SECONDS:-900}
      ANALYZER_POLL_SECONDS: ${ANALYZER_POLL_SECONDS:-2}
    # Solo lo que usa y en solo lectura (escribe únicamente en BD). NUNCA la raíz
    # del proyecto: ahí están .env (secretos OAuth, APP_KEY), storage/sessions
    # (tokens de sesión) y el volcado del legacy con datos personales.
    volumes:
      - ./analyzer:/srv/daino/analyzer:ro                           # código del worker
      - ./package.json:/srv/daino/package.json:ro                   # "type": "module" del charter JS
      # Sin node_modules: el charting no importa ningún paquete npm (Ola 5, comprobado
      # recorriendo los imports de chart-from-analysis.mjs y bake-official.mjs).
      - ./resources/js:/srv/daino/resources/js:ro                   # charter compartido con el navegador
      - ./scripts:/srv/daino/scripts:ro                             # chart-from-analysis.mjs, bake-official.mjs
      - ./database:/srv/daino/database:ro                           # migraciones (tests) y manifiesto oficial
      - ./storage/uploads/levels:/srv/daino/storage/uploads/levels:ro
      - ./storage/official:/srv/daino/storage/official:ro
    mem_limit: ${ANALYZER_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "python", "-m", "daino_analyzer", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - daino

  mariadb:
    image: mariadb:11.4
    container_name: daino-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: ${DB_DATABASE:-daino}
      MARIADB_USER: ${DB_USER:-daino}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - daino-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - daino

volumes:
  daino-db:
    driver: local

networks:
  daino:
    driver: bridge
