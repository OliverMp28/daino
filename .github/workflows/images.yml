# Imágenes de producción de Daino en GHCR (las despliega Coolify con
# docker-compose.prod.yml; el VPS no construye nada).
#
#   ghcr.io/olivermp28/daino-php       docker/production/Dockerfile, target php
#   ghcr.io/olivermp28/daino-web       docker/production/Dockerfile, target web
#   ghcr.io/olivermp28/daino-analyzer  analyzer/Dockerfile, target production
#
# Tags: `sha-<7 primeros caracteres del commit>` en cada build y `latest`, que
# solo se mueve cuando las TRES se han publicado (job `latest`): así `latest`
# nunca mezcla versiones. En Coolify, DAINO_IMAGE_TAG elige el tag de las tres.

name: Imágenes de producción

on:
  push:
    branches: [rewrite/v2]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: daino-php
            dockerfile: docker/production/Dockerfile
            target: php
          - image: daino-web
            dockerfile: docker/production/Dockerfile
            target: web
          - image: daino-analyzer
            dockerfile: analyzer/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@v4

      - name: Nombre y tag
        id: ref
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.prefix }}/${{ matrix.image }}:${{ steps.ref.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  latest:
    name: latest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mover latest a este commit (las tres a la vez)
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="sha-${GITHUB_SHA::7}"
          for image in daino-php daino-web daino-analyzer; do
            docker buildx imagetools create -t "$prefix/$image:latest" "$prefix/$image:$tag"
          done
          echo "Publicado $tag (y latest) de daino-php, daino-web y daino-analyzer" >> "$GITHUB_STEP_SUMMARY"
