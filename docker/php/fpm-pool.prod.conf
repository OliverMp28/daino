; Daino — pool de PHP-FPM en producción. Se carga después de www.conf y
; docker.conf (orden alfabético), así que estos valores mandan.
;
; VPS de 1 vCPU y 4 GB compartido con otras apps: pocos procesos y que se
; reciclen. Cada uno ocupa ~10-20 MB en reposo; 6 a la vez son ~120 MB como
; mucho. Las peticiones de Daino son cortas (API JSON); la más larga es servir
; un MP3 (≤ 10 MB) a quien juega.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
