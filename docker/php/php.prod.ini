; Daino — PHP en producción (docker/production/Dockerfile).
; El de desarrollo es el de docker/php/Dockerfile + daino-uploads.ini.

expose_php = Off
date.timezone = UTC

; Subidas: MP3 de hasta UPLOAD_MAX_SIZE_MB (10) con margen para el multipart.
; El tamaño real lo valida FileUploadService; esto es la red de PHP.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 128M

; OPcache: el código no cambia dentro de la imagen, no hace falta mirar los
; archivos en cada petición. Sin JIT: la app espera a la BD y a la red, no
; calcula, y el VPS es pequeño.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.jit = disable
opcache.jit_buffer_size = 0
