# Nginx vhost para Daino.
# docroot = /var/www/html/public (front controller: index.php).
# Todo fuera de /public se niega explícitamente por seguridad.

# Quién puede meter una página de Daino en un iframe.
# Las páginas del juego (/, /niveles, /niveles/{id}) traen su propia política
# (`Content-Security-Policy: frame-ancestors 'self' <VOUT_ORIGIN>`, HomeController):
# las embebe el portal de Vout. La guía de Vout pide no mandarles además
# X-Frame-Options: aunque los navegadores den prioridad a frame-ancestors, con
# X-Frame-Options presente su comprobación da el juego por no embebible.
# Todo lo demás (login, callback, API, errores, archivos) no se enmarca en
# ningún sitio, ni siquiera en Daino: DENY y frame-ancestors 'none'.
map $upstream_http_content_security_policy $daino_frame_options {
    ""      "DENY";
    default "";
}
map $upstream_http_content_security_policy $daino_frame_csp {
    ""      "frame-ancestors 'none'";
    default "";
}

# Producción: navegador → Cloudflare (HTTPS) → túnel → proxy de Coolify → aquí
# por HTTP. Lo que PHP debe saber del navegador llega en cabeceras del proxy.
# Daino no construye URLs ni decide `Secure` a partir de la petición (salen de
# APP_URL, VOUT_REDIRECT_URI y APP_ENV), así que esto es para que PHP y los logs
# vean la verdad, no un requisito para que funcione. En local no llega ninguna
# de estas cabeceras y todo queda como antes.
map "$http_x_forwarded_proto|$http_cf_visitor" $daino_https {
    "~https" on;
    default  "";
}
map $daino_https $daino_scheme {
    on      https;
    default $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # IP real del cliente: la última de X-Forwarded-For que no sea de la red
    # privada (Cloudflare la añade; el proxy de Coolify y el túnel, detrás, son
    # IPs privadas). Este contenedor no publica puertos: solo le llega tráfico
    # por la red de Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Negar acceso directo a carpetas no públicas del proyecto.
    # (Incluso si alguien cambia docroot por error, este bloque protege.)
    location ~ ^/(app|docker|docs|resources|routes|storage|database|scripts|tests|vendor)(/|$) {
        deny all;
        return 404;
    }

    # Negar archivos ocultos y sensibles.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(env|composer\.(json|lock)|package(-lock)?\.json|bun\.lock|vite\.config\.js)$ {
        deny all;
        return 404;
    }

    # Assets compilados por Vite: long-term cache inmutable.
    location /build/ {
        access_log off;
        # Un add_header aquí anula los del server: se repiten los que importan.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Rutas dinámicas: todo lo que no sea archivo real → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Delegar PHP al contenedor php-fpm. `daino-php` es el container_name en
    # local y el nombre del servicio en producción (docker-compose.prod.yml):
    # un nombre propio, porque Coolify puede meter varias apps en la misma red
    # y otra podría tener un servicio llamado `php`.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass daino-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param HTTPS $daino_https if_not_empty;
        fastcgi_param REQUEST_SCHEME $daino_scheme;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # Headers globales de seguridad (básicos; CSP se afinará en otro paso)
    add_header X-Content-Type-Options "nosniff" always;
    # Vacío (no se envía) cuando la respuesta trae su propia política: ver el map de arriba.
    add_header X-Frame-Options $daino_frame_options always;
    add_header Content-Security-Policy $daino_frame_csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
