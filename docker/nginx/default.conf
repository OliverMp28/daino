# Nginx vhost para Daino.
# docroot = /var/www/html/public (front controller: index.php).
# Todo fuera de /public se niega explícitamente por seguridad.

# Quién puede meter una página de Daino en un iframe lo dice UNA cabecera, no dos.
# La página del juego trae la suya (`Content-Security-Policy: frame-ancestors`,
# HomeController: ella misma y el portal de Vout, que la embebe). A todo lo demás
# se le pone X-Frame-Options, que no sabe de listas de orígenes. La guía de Vout
# pide no mandar las dos: aunque los navegadores den prioridad a frame-ancestors,
# con X-Frame-Options presente su comprobación da el juego por no embebible.
map $upstream_http_content_security_policy $daino_frame_options {
    ""      "SAMEORIGIN";
    default "";
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Negar acceso directo a carpetas no públicas del proyecto.
    # (Incluso si alguien cambia docroot por error, este bloque protege.)
    location ~ ^/(app|docker|docs|resources|routes|storage|database|scripts|tests|vendor)(/|$) {
        deny all;
        return 404;
    }

    # Negar archivos ocultos y sensibles.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.(env|composer\.(json|lock)|package(-lock)?\.json|bun\.lock|vite\.config\.js)$ {
        deny all;
        return 404;
    }

    # Assets compilados por Vite: long-term cache inmutable.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Rutas dinámicas: todo lo que no sea archivo real → index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Delegar PHP al contenedor php-fpm
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
    }

    # Headers globales de seguridad (básicos; CSP se afinará en otro paso)
    add_header X-Content-Type-Options "nosniff" always;
    # Vacío (no se envía) cuando la respuesta trae su propia política: ver el map de arriba.
    add_header X-Frame-Options $daino_frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
